  /projects:
    get:
      tags: [Projects]
      summary: List projects
      description: |
        Admin sees every project, including unassigned ones
        (`team_id: null`). A team member sees only their own team's
        projects — unassigned projects and other teams' projects are not
        included. A user with no team sees an empty list. No pagination.
      responses:
        '200':
          description: Array of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Projects]
      summary: Create a project
      description: |
        Admin only. `created_by_id` is always the current admin — never
        accepted as input. `team_id` cannot be set here; use
        `POST /projects/{id}/assign_team` after creation. `status`
        defaults to `planning` and is not accepted on create. `start_date`
        is system-controlled (see `PATCH /projects/{id}`) and not accepted
        here either.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequest'
            example:
              title: Website Redesign
              description: Refresh the marketing site
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /projects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Project ID
        schema:
          type: integer
    get:
      tags: [Projects]
      summary: Get a project
      description: Admin, or a member of the project's own team. 403 for an unrelated team's member, and for anyone non-admin on an unassigned project.
      responses:
        '200':
          description: The project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Projects]
      summary: Update a project
      description: |
        Admin only. Accepts `title`, `description`, `status`, `end_date`.
        `team_id` is intentionally not accepted here — use the dedicated
        assign/unassign endpoints, which also carry the archive side
        effect described there.

        Status rules: `active`, `onhold`, and `completed` all require the
        project to already have a team (`422` otherwise). `planning` and
        `archived` do not require a team. Setting `status` to `active` for
        the first time automatically stamps `start_date` with today's
        date (once only — later transitions don't move it).
        `end_date`, if set, must be strictly after `start_date`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdateRequest'
      responses:
        '200':
          description: Updated project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    put:
      tags: [Projects]
      summary: Update a project (same behavior as PATCH)
      description: Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdateRequest'
      responses:
        '200':
          description: Updated project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [Projects]
      summary: Delete a project
      description: Admin only.
      responses:
        '204':
          description: Deleted, no content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{id}/assign_team:
    post:
      tags: [Projects]
      summary: Assign (or reassign) a project's team
      description: |
        Admin only. Looks up the team by `team_name` (case-insensitive) and
        sets `team_id` to it, whether the project was previously unassigned
        or belonged to a different team. A `team_name` that doesn't match
        any `Team` row is `404`. Does **not** change `status` — in
        particular, reassigning a team to an `archived` project leaves it
        `archived`; nothing auto-reactivates it.
      parameters:
        - name: id
          in: path
          required: true
          description: Project ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                team_name:
                  type: string
              required: [team_name]
            example:
              team_name: Team B
      responses:
        '200':
          description: Project with the team assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /projects/{id}/unassign_team:
    delete:
      tags: [Projects]
      summary: Unassign a project's team
      description: |
        Admin only. Sets `team_id` to `null` and, as a direct consequence,
        automatically forces `status` to `archived` — this is the one case
        where `archived` is reachable with no team present.
      parameters:
        - name: id
          in: path
          required: true
          description: Project ID
          schema:
            type: integer
      responses:
        '200':
          description: Project with the team unassigned (now archived)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{project_id}/issues:
    parameters:
      - name: project_id
        in: path
        required: true
        description: Project ID
        schema:
          type: integer
    get:
      tags: [Issues]
      summary: List a project's issues
      description: |
        Admin, or a member of the project's team. A member of any other
        team gets `403`. No pagination.
      responses:
        '200':
          description: Array of issues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Issue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Issues]
      summary: Raise an issue against a project
      description: |
        Members of the project's team only — including that team's lead.
        **Admins cannot raise issues** (`403`); admin is read-only on this
        resource at every status.

        `raised_by_id` is always the authenticated user and is never
        accepted as input. `status` always starts as `open` and cannot be
        set here. `resolution_note` cannot be set on an open issue at all.

        The project must currently be `active` and belong to the raiser's
        team, otherwise `422`. (This is checked only at creation — an issue
        stays workable if its project later moves to `onhold`/`archived`.)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueCreateRequest'
            example:
              title: Login button is misaligned
              description: Only on Safari, below 900px wide
      responses:
        '201':
          description: Issue created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /issues:
    get:
      tags: [Issues]
      summary: List issues across every project
      description: |
        Admin: every issue in the company. Team lead or member: only issues
        belonging to their own team's projects, across all of them (not just
        one). A caller with no team gets `403`. No pagination.
      responses:
        '200':
          description: Array of issues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Issue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /issues/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Issue ID
        schema:
          type: integer
    get:
      tags: [Issues]
      summary: Get an issue
      description: Admin, or a member of the issue's project's team. Readable at any status, including after it has been resolved or rejected.
      responses:
        '200':
          description: The issue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Issues]
      summary: Edit an issue
      description: |
        Only the member who raised the issue, and only while it is still
        `open`. Team leads and admins cannot edit issues at all (`403`).

        Accepts `title` and `description` only — `status` and
        `resolution_note` are never mass-assignable and are silently
        ignored if supplied. Use the resolve/reject endpoints for those.

        Returns `403` once the issue is `resolved` or `rejected`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueUpdateRequest'
      responses:
        '200':
          description: Updated issue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    put:
      tags: [Issues]
      summary: Edit an issue (same behavior as PATCH)
      description: Only the member who raised the issue, while it is still open.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueUpdateRequest'
      responses:
        '200':
          description: Updated issue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [Issues]
      summary: Delete an issue
      description: |
        The member who **raised** it, only while the issue is still `open` —
        they get `403` once it is `resolved` or `rejected`. A team lead who
        did not raise it cannot delete it at any status.

        An **admin** may delete any issue on any team, at any status, closed
        included. This is the only way a `resolved`/`rejected` issue can be
        removed: it is permanent for the team that raised it, but not for an
        admin moderating it away.

        Any tasks promoted from it survive, with their `issue_id` set to
        `null`.
      responses:
        '204':
          description: Deleted, no content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /issues/{id}/resolve:
    post:
      tags: [Issues]
      summary: Resolve an issue
      description: |
        Only the designated lead of the issue's project's team — that is,
        the user named by `teams.team_lead_id`. A user whose
        `employment_detail.role` is `team_lead` but who is *not* their
        team's `team_lead_id` gets `403`, as do the issue's owner, other
        teammates, and admins.

        `resolution_note` is **required** — omitting it returns `422` and
        the issue stays `open`.

        Only works on an `open` issue; a `resolved`/`rejected` issue is
        terminal and returns `403`.
      parameters:
        - name: id
          in: path
          required: true
          description: Issue ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueCloseRequest'
            example:
              resolution_note: Fixed in release 2.1
      responses:
        '200':
          description: Issue resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /issues/{id}/reject:
    post:
      tags: [Issues]
      summary: Reject an issue
      description: |
        Identical authorization and rules to `/issues/{id}/resolve`, but
        sets `status` to `rejected`. `resolution_note` is required, and the
        issue is locked permanently afterwards.
      parameters:
        - name: id
          in: path
          required: true
          description: Issue ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueCloseRequest'
            example:
              resolution_note: Working as designed
      responses:
        '200':
          description: Issue rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /projects/{project_id}/tasks:
    parameters:
      - name: project_id
        in: path
        required: true
        description: Project ID
        schema:
          type: integer
    get:
      tags: [Tasks]
      summary: List a project's tasks
      description: |
        Admin, or any member of the project's team. A member of any other
        team gets `403`. No pagination.
      responses:
        '200':
          description: Array of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Tasks]
      summary: Create a task on a project
      description: |
        The project team's **designated lead** only (`teams.team_lead_id`) —
        a user whose `employment_detail.role` is `team_lead` without being
        their team's designated lead gets `403`, as do members, other teams,
        and admins.

        `created_by_id` is always the authenticated lead and is never
        accepted as input. A task always starts `unassigned` with no
        assignee — `status` and `assigned_to_id` cannot be set here, use
        `POST /tasks/{id}/assign`.

        The project must currently be `active`, otherwise `422`. (Checked
        only at creation — a task stays workable if its project later moves
        to `onhold`/`archived`.) `issue_id` is optional and must reference an
        issue on the same project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
            example:
              title: Fix Safari layout on the login screen
              description: Reproduce below 900px, then correct the flex basis
              priority: high
              due_date: '2026-09-01'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /tasks:
    get:
      tags: [Tasks]
      summary: List tasks across every project
      description: |
        Admin: every task in the company. Team lead or member: only tasks
        belonging to their own team's projects, across all of them (not just
        one). A caller with no team gets `403`. No pagination.
      responses:
        '200':
          description: Array of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Task ID
        schema:
          type: integer
    get:
      tags: [Tasks]
      summary: Get a task
      description: Admin, or any member of the task's project's team. Readable at any status.
      responses:
        '200':
          description: The task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Tasks]
      summary: Update a task's details
      description: |
        The project team's designated lead only, at any status — including
        after the task is `completed`.

        `status` and `assigned_to_id` are **not** accepted here (they are
        silently ignored): use `/assign`, `/unassign`, and `/status`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdateRequest'
            example:
              title: Fix Safari layout on the login screen
              priority: critical
      responses:
        '200':
          description: Task updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    put:
      tags: [Tasks]
      summary: Update a task's details (alias of PATCH)
      description: Identical to `PATCH /tasks/{id}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdateRequest'
      responses:
        '200':
          description: Task updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [Tasks]
      summary: Delete a task
      description: |
        The project team's designated lead, or an **admin** (on any team),
        at any status.
      responses:
        '204':
          description: Task deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /tasks/{id}/assign:
    post:
      tags: [Tasks]
      summary: Assign or reassign a task
      description: |
        The project team's designated lead only. Sets `assigned_to_id` and
        moves the task to `assigned` (work starts now) or `on_hold` (parked).
        Any other `status` value returns `422`.

        The assignee must be a member of the project's team, otherwise `422`.
        Works from any status, so this is also how a task is reassigned to a
        different member.
      parameters:
        - name: id
          in: path
          required: true
          description: Task ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskAssignRequest'
            example:
              assigned_to_id: 42
              status: assigned
      responses:
        '200':
          description: Task assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /tasks/{id}/unassign:
    delete:
      tags: [Tasks]
      summary: Unassign a task
      description: |
        The project team's designated lead only. Clears `assigned_to_id` and
        resets `status` to `unassigned`, from any status. Returns the task
        rather than `204`.
      parameters:
        - name: id
          in: path
          required: true
          description: Task ID
          schema:
            type: integer
      responses:
        '200':
          description: Task unassigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /tasks/{id}/status:
    patch:
      tags: [Tasks]
      summary: Move a task through the workflow
      description: |
        The project team's designated lead **or** the task's current
        assignee — anyone else (including admins and other teammates) gets
        `403`. Each of the two drives a different half of the workflow, and a
        lead who assigned the task to themself gets both sets:

        | From | Assignee may set | Lead may set |
        |---|---|---|
        | `assigned` | `working` | `on_hold` |
        | `working` | `ready_for_review` | `on_hold` |
        | `ready_for_review` | — | `returned`, `completed`, `on_hold` |
        | `returned` | `working`, `ready_for_review` | `on_hold` |
        | `on_hold` | — | `assigned` |
        | `completed` | — | `returned`, `on_hold` |

        `unassigned` is only entered and left through `/assign` and
        `/unassign`. A move that isn't in the caller's row — including
        setting the status the task already has — returns `422`, as does an
        unknown status value.

        Note that `completed` is reachable only from `ready_for_review`, so
        completion always passes through review; `completed` is not terminal
        and the lead can reopen it to `returned`.
      parameters:
        - name: id
          in: path
          required: true
          description: Task ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskStatusRequest'
            example:
              status: ready_for_review
      responses:
        '200':
          description: Status changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token from `POST /auth/login` or `POST /auth/refresh`, sent
        as `Authorization: Bearer <token>`. Must be a token of JWT `type:
        "access"` — a refresh token here is treated the same as no token at
        all (401).

  parameters:
    UserId:
      name: id
      in: path
      required: true
      description: User ID
      schema:
        type: integer
    UserIdPathParam:
      name: user_id
      in: path
      required: true
      description: User ID (parent resource)
      schema:
        type: integer

  responses:
    Unauthorized:
      description: Missing/invalid/expired access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Please log in
    Forbidden:
      description: Authenticated, but not permitted to perform this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: You are not authorized to perform this action
    NotFound:
      description: Record not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Record not found
    UnprocessableEntity:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          example:
            errors: ["Email has already been taken", "Username can't be blank"]

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    ValidationErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: string
      required: [errors]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    DashboardCounts:
      type: object
      description: >-
        `counts`' keys depend on `role` — see the endpoint description for
        which fields appear for each role.
      properties:
        role:
          type: string
          enum: [admin, team_lead, member]
        counts:
          type: object
          properties:
            teams:
              type: integer
              description: admin only
            projects:
              type: integer
              description: >-
                All roles, but scoped differently: company-wide for admin,
                within-team for team_lead and member. 0 for a member with no
                team.
            tasks:
              type: integer
              description: admin or team_lead
            issues:
              type: integer
              description: >-
                All roles, but scoped differently: company-wide for admin,
                within-team for team_lead, raised-by-caller for member.
            my_tasks:
              type: integer
              description: member only
            due_today_tasks:
              type: integer
              description: member only
            team_members:
              type: integer
              description: >-
                team_lead or member — headcount of the caller's team
                (team_lead's own team, or the member's). 0 if the caller has
                no team.
      required: [role, counts]

    LoginRequest:
      type: object
      description: "`username` accepts either the actual username or the email address — the server tries both."
      properties:
        username:
          type: string
          example: alice
        password:
          type: string
          format: password
          example: password123
      required: [username, password]

    LoginResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        access_token:
          type: string
          description: JWT, type "access", expires in 15 minutes
        refresh_token:
          type: string
          description: JWT, type "refresh", expires in 7 days
      required: [user, access_token, refresh_token]

    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
      required: [refresh_token]

    RefreshResponse:
      type: object
      properties:
        access_token:
          type: string
          description: JWT, type "access", expires in 15 minutes
      required: [access_token]

    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required: [email]

    ResetPasswordRequest:
      type: object
      properties:
        token:
          type: string
          description: Raw token from the emailed reset link (not the hashed value stored server-side)
        password:
          type: string
          format: password
        password_confirmation:
          type: string
          format: password
      required: [token, password, password_confirmation]

    User:
      type: object
      description: Embeds `profile` and `employment_detail` inline; both are `null` if not yet created for this user.
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        profile:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Profile'
        employment_detail:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/EmploymentDetail'
      required: [id, username, email, created_at, updated_at]

    UserDirectoryEntry:
      type: object
      description: >-
        The flat shape returned by `GET /users` (`UserDirectorySerializer`),
        used for every caller alike. `id`/`username`/`email` come straight
        off the user and are never absent. Every other field is derived from
        `profile`/`employment_detail`/`employment_detail.team` and renders as
        the literal string `"No record!"` if that backing record (or field)
        doesn't exist — e.g. an admin has no team (`team_name: "No record!"`),
        and a user with no `employment_detail` at all gets `"No record!"` for
        `role`, `team_name`, `job_position`, and `joined_at`.
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
          format: email
        image_url:
          type: string
          description: From `profile.image_url`, or `"No record!"`.
        role:
          type: string
          description: From `employment_detail.role`, or `"No record!"`.
        team_name:
          type: string
          description: From `employment_detail.team.name`, or `"No record!"`.
        job_position:
          type: string
          description: From `employment_detail.job_position`, or `"No record!"`.
        joined_at:
          type: string
          description: From `employment_detail.joined_at`, or `"No record!"`.
      required: [id, username, email, image_url, role, team_name, job_position, joined_at]

    TeammateName:
      type: object
      description: The trimmed shape returned by `GET /me/teammates` (`TeammateNameSerializer`).
      properties:
        id:
          type: integer
        full_name:
          type: string
          nullable: true
          description: From `profile.full_name`. Null if the teammate has no profile.
      required: [id, full_name]

    UserCreateRequest:
      type: object
      properties:
        username:
          type: string
          description: Required, unique (case-insensitive)
        email:
          type: string
          format: email
          description: Required, unique (case-insensitive), must be a valid email format
        password:
          type: string
          format: password
          description: Required (via has_secure_password); no explicit minimum length enforced beyond bcrypt's own limits
        password_confirmation:
          type: string
          format: password
          description: Must match `password` if provided
      required: [username, email, password]

    UserUpdateRequest:
      type: object
      description: All fields optional on update; only supplied fields are changed. Same validation rules as create.
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        password_confirmation:
          type: string
          format: password

    Profile:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        full_name:
          type: string
        phone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        image_url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, user_id, full_name, created_at, updated_at]

    ProfileRequest:
      type: object
      properties:
        full_name:
          type: string
          description: Required
        phone:
          type: string
        address:
          type: string
        city:
          type: string
        country:
          type: string
        image_url:
          type: string
      required: [full_name]

    EmploymentDetail:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        team_id:
          type: integer
          nullable: true
          description: Null for admins (enforced) and for employees not yet assigned to a team
        role:
          type: string
          enum: [admin, team_lead, member]
        job_position:
          type: string
        joined_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, user_id, role, job_position, joined_at, created_at, updated_at]

    EmploymentDetailRequest:
      type: object
      properties:
        team_id:
          type: integer
          nullable: true
          description: Optional. Must be omitted/null if role is "admin".
        role:
          type: string
          enum: [admin, team_lead, member]
          description: Defaults to "member" (enum default 2) if omitted
        job_position:
          type: string
          description: Required
        joined_at:
          type: string
          format: date-time
          description: Required
      required: [job_position, joined_at]

    Team:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        team_lead_id:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, name, created_at, updated_at]

    TeamSummaryEntry:
      type: object
      description: >-
        The flat shape returned by both `GET /teams` and `GET /teams/{id}`
        (`TeamSummarySerializer`). `team_lead_name` is resolved from
        `team_lead.profile.full_name` and is `null` whenever `team_lead_id`
        is null, or the lead has no profile / no `full_name` set.
      properties:
        id:
          type: integer
        name:
          type: string
        team_lead_id:
          type: integer
          nullable: true
        team_lead_name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
      required: [id, name, team_lead_id, team_lead_name, description, created_at]

    TeamRequest:
      type: object
      properties:
        name:
          type: string
          description: Required, unique (case-insensitive)
        description:
          type: string
        team_lead_id:
          type: integer
          nullable: true
          description: Optional — a team may have no lead yet
      required: [name]

    Project:
      type: object
      properties:
        id:
          type: integer
        team_id:
          type: integer
          nullable: true
          description: Null until assigned via POST /projects/{id}/assign_team
        created_by_id:
          type: integer
          description: The admin who created the project. System-controlled, never editable.
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [planning, active, onhold, completed, archived]
        start_date:
          type: string
          format: date
          nullable: true
          description: Auto-set the first time status becomes "active"; never set manually
        end_date:
          type: string
          format: date
          nullable: true
          description: Admin-settable. Must be strictly after start_date if both are present.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, created_by_id, title, status, created_at, updated_at]

    ProjectCreateRequest:
      type: object
      properties:
        title:
          type: string
          description: Required
        description:
          type: string
      required: [title]

    ProjectUpdateRequest:
      type: object
      description: All fields optional; only supplied fields are changed. team_id is not accepted (use assign_team/unassign_team).
      properties:
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [planning, active, onhold, completed, archived]
          description: active/onhold/completed require the project to already have a team; planning/archived do not
        end_date:
          type: string
          format: date

    Issue:
      type: object
      properties:
        id:
          type: integer
        project_id:
          type: integer
        raised_by_id:
          type: integer
          description: The team member who raised the issue. System-controlled, never editable.
        raised_by_name:
          type: string
          nullable: true
          description: The raiser's full name, resolved from their profile. Null if they have no profile.
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [open, resolved, rejected]
          description: Starts as "open". Only the project team's lead can move it to resolved/rejected, and that transition is permanent.
        resolution_note:
          type: string
          nullable: true
          description: Null while open. Set by the team lead when resolving or rejecting, and required at that point.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, project_id, raised_by_id, title, status, created_at, updated_at]

    IssueCreateRequest:
      type: object
      properties:
        title:
          type: string
          description: Required
        description:
          type: string
      required: [title]

    IssueUpdateRequest:
      type: object
      description: All fields optional. status and resolution_note are not accepted here — use the resolve/reject endpoints.
      properties:
        title:
          type: string
        description:
          type: string

    IssueCloseRequest:
      type: object
      properties:
        resolution_note:
          type: string
          description: Required — the lead's justification for resolving or rejecting
      required: [resolution_note]

    Task:
      type: object
      properties:
        id:
          type: integer
        project_id:
          type: integer
        issue_id:
          type: integer
          nullable: true
          description: The issue this task was promoted from, if any. Must belong to the same project.
        created_by_id:
          type: integer
          description: The project team's lead who created the task. System-controlled, never editable.
        created_by_name:
          type: string
          nullable: true
          description: The creator's full name, resolved from their profile. Null if they have no profile.
        assigned_to_id:
          type: integer
          nullable: true
          description: The team member currently working the task. Set only through /assign and /unassign.
        assigned_to_name:
          type: string
          nullable: true
          description: The assignee's full name, resolved from their profile. Null while unassigned, or if they have no profile.
        title:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 5000
        priority:
          type: string
          enum: [critical, high, medium, normal]
          description: Defaults to "normal".
        status:
          type: string
          enum: [unassigned, assigned, working, on_hold, ready_for_review, returned, completed]
          description: >-
            Starts as "unassigned". Always travels with assigned_to_id — any status other than
            "unassigned" requires an assignee, and clearing the assignee returns it to "unassigned".
        due_date:
          type: string
          format: date
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, project_id, created_by_id, title, description, priority, status, created_at, updated_at]

    TaskCreateRequest:
      type: object
      description: status, assigned_to_id and created_by_id are not accepted — a task always starts unassigned.
      properties:
        title:
          type: string
          maxLength: 255
          description: Required
        description:
          type: string
          maxLength: 5000
          description: Required
        priority:
          type: string
          enum: [critical, high, medium, normal]
        due_date:
          type: string
          format: date
        issue_id:
          type: integer
          description: Optional — must be an issue on the same project
      required: [title, description]

    TaskUpdateRequest:
      type: object
      description: All fields optional. status and assigned_to_id are not accepted here — use /assign, /unassign, /status.
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 5000
        priority:
          type: string
          enum: [critical, high, medium, normal]
        due_date:
          type: string
          format: date
        issue_id:
          type: integer

    TaskAssignRequest:
      type: object
      properties:
        assigned_to_id:
          type: integer
          description: Required — a member of the project's team
        status:
          type: string
          enum: [assigned, on_hold]
          description: Defaults to "assigned". Any other value is rejected with 422.
      required: [assigned_to_id]

    TaskStatusRequest:
      type: object
      properties:
        status:
          type: string
          enum: [assigned, working, on_hold, ready_for_review, returned, completed]
          description: >-
            Required — must be a legal move for the caller from the task's current status
            (see the transition table on PATCH /tasks/{id}/status).
      required: [status]
