  /issues/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Issue ID
        schema:
          type: integer
    get:
      tags: [Issues]
      summary: Get an issue
      description: Admin, or a member of the issue's project's team. Readable at any status, including after it has been resolved or rejected.
      responses:
        '200':
          description: The issue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Issues]
      summary: Edit an issue
      description: |
        Only the member who raised the issue, and only while it is still
        `open`. Team leads and admins cannot edit issues at all (`403`).

        Accepts `title` and `description` only — `status` and
        `resolution_note` are never mass-assignable and are silently
        ignored if supplied. Use the resolve/reject endpoints for those.

        Returns `403` once the issue is `resolved` or `rejected`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueUpdateRequest'
      responses:
        '200':
          description: Updated issue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    put:
      tags: [Issues]
      summary: Edit an issue (same behavior as PATCH)
      description: Only the member who raised the issue, while it is still open.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueUpdateRequest'
      responses:
        '200':
          description: Updated issue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [Issues]
      summary: Delete an issue
      description: |
        The member who **raised** it, only while the issue is still `open` —
        they get `403` once it is `resolved` or `rejected`. A team lead who
        did not raise it cannot delete it at any status.

        An **admin** may delete any issue on any team, at any status, closed
        included. This is the only way a `resolved`/`rejected` issue can be
        removed: it is permanent for the team that raised it, but not for an
        admin moderating it away.

        Deleting an issue also deletes its comments. Any tasks promoted from
        it survive, with their `issue_id` set to `null`.
      responses:
        '204':
          description: Deleted, no content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /issues/{id}/resolve:
    post:
      tags: [Issues]
      summary: Resolve an issue
      description: |
        Only the designated lead of the issue's project's team — that is,
        the user named by `teams.team_lead_id`. A user whose
        `employment_detail.role` is `team_lead` but who is *not* their
        team's `team_lead_id` gets `403`, as do the issue's owner, other
        teammates, and admins.

        `resolution_note` is **required** — omitting it returns `422` and
        the issue stays `open`.

        Only works on an `open` issue; a `resolved`/`rejected` issue is
        terminal and returns `403`.
      parameters:
        - name: id
          in: path
          required: true
          description: Issue ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueCloseRequest'
            example:
              resolution_note: Fixed in release 2.1
      responses:
        '200':
          description: Issue resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /issues/{id}/reject:
    post:
      tags: [Issues]
      summary: Reject an issue
      description: |
        Identical authorization and rules to `/issues/{id}/resolve`, but
        sets `status` to `rejected`. `resolution_note` is required, and the
        issue is locked permanently afterwards.
      parameters:
        - name: id
          in: path
          required: true
          description: Issue ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueCloseRequest'
            example:
              resolution_note: Working as designed
      responses:
        '200':
          description: Issue rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /projects/{project_id}/tasks:
    parameters:
      - name: project_id
        in: path
        required: true
        description: Project ID
        schema:
          type: integer
    get:
      tags: [Tasks]
      summary: List a project's tasks
      description: |
        Admin, or any member of the project's team. A member of any other
        team gets `403`. No pagination.
      responses:
        '200':
          description: Array of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Tasks]
      summary: Create a task on a project
      description: |
        The project team's **designated lead** only (`teams.team_lead_id`) —
        a user whose `employment_detail.role` is `team_lead` without being
        their team's designated lead gets `403`, as do members, other teams,
        and admins.

        `created_by_id` is always the authenticated lead and is never
        accepted as input. A task always starts `unassigned` with no
        assignee — `status` and `assigned_to_id` cannot be set here, use
        `POST /tasks/{id}/assign`.

        The project must currently be `active`, otherwise `422`. (Checked
        only at creation — a task stays workable if its project later moves
        to `onhold`/`archived`.) `issue_id` is optional and must reference an
        issue on the same project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
