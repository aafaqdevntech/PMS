openapi: 3.0.3
info:
  title: Team Directory API
  description: |
    Admin-managed user/profile/employment/team directory API.

    There is no public sign-up — every account is created by an admin via
    `POST /users`. Authentication is JWT-based with short-lived access
    tokens and long-lived refresh tokens. Authorization is role-based via
    Pundit, where a user's role (`admin` / `team_lead` / `member`) lives on
    their `EmploymentDetail` record, not on the `User` record itself.

    ### Authentication
    - The **access token** is sent as `Authorization: Bearer <token>` on
      every request to a protected endpoint. It is short-lived (15 minutes).
    - The **refresh token** is sent in the JSON body of `POST /auth/refresh`
      and `POST /auth/logout` (`{"refresh_token": "..."}`) — it is never sent
      as a header. It is long-lived (7 days) and is only used to mint a new
      access token or to end its own session.
    - Tokens are HS256 JWTs carrying `{user_id, type, exp}` (refresh tokens
      also carry `jti`, a per-session ID), where `type` is `"access"` or
      `"refresh"`. A token of the wrong `type` is rejected by the endpoint
      that doesn't expect it (e.g. an access token submitted to
      `/auth/refresh`, or a refresh token used as a Bearer token).
    - Every refresh token is tracked server-side (by its `jti`) so it can be
      individually revoked — `POST /auth/logout` revokes the one session its
      refresh token belongs to, leaving the user's other sessions/devices
      logged in. This is the one piece of auth state that isn't purely
      derived from the JWT's own signature and `exp`. **Access tokens are
      not tracked this way**: logout stops a session from minting further
      access tokens, but an access token already handed to the client keeps
      working until its own 15-minute expiry passes.
    - Missing, malformed, expired, or wrong-type tokens all resolve to the
      same outcome for protected endpoints: `401 Unauthorized` with
      `{"error": "Please log in"}`. `/auth/refresh` and `/auth/logout` report
      their own token problems as `401 Unauthorized` with
      `{"error": "Invalid refresh token"}` — this covers a revoked token too.
    - `POST /auth/login`, `POST /auth/refresh`, `POST /password/forgot`, and
      `PATCH /password/reset` do **not** require a token. `POST /auth/logout`
      **does** — it needs the caller's access token to confirm the refresh
      token being revoked belongs to them.

    ### Authorization
    - "Admin" means the requesting user's `employment_detail.role` is
      `admin`. A user's role is never taken from the request — it's looked
      up from their own `EmploymentDetail` row server-side.
    - Every `create`/`update`/`destroy` on Users, Profiles, Employment
      Details, and Teams is **admin-only**.
    - A non-admin user may only `GET` their own User, Profile, and
      Employment Detail records (`show` actions), plus `GET /me`.
    - `GET /teams` and `GET /teams/:id` are open to **any authenticated
      user** (not just admins) — a user needs to be able to see their own
      team.
    - On Issues and Tasks an admin is a **reader and a moderator**: they can
      read every record on every team, and delete any of them, but they
      never raise an issue or create/work a task. The admin's delete reaches
      past the issue terminal lock — a `resolved`/`rejected` issue is
      permanent for the team that raised it, but an admin can still purge it.
    - Authorization failures return `403 Forbidden` with
      `{"error": "You are not authorized to perform this action"}`.
  version: "1.0.0"
servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://api.example.com
    description: "Placeholder — replace with the real deployed API host"
tags:
  - name: Authentication
    description: Login and access-token refresh
  - name: Password Reset
    description: Self-service password reset via emailed token (no login required)
  - name: Users
    description: User accounts (admin-managed; no public sign-up)
  - name: Profiles
    description: Per-user profile details (one profile per user)
  - name: Employment Details
    description: Per-user role, job position, and team assignment (one per user)
  - name: Teams
    description: Teams that employment details can reference
  - name: Projects
    description: Team-owned projects (admin-managed; read access is team-scoped)
  - name: Issues
    description: Issues raised by team members against their team's projects (admin reads and deletes, but never raises or closes)
  - name: Tasks
    description: Work items on a team's projects, managed by the team lead and worked by one assignee (admin reads and deletes, but takes no part in the workflow)

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [Authentication]
      summary: Log in with username or email + password
      description: |
        Accepts either a username or an email address in the `username`
        field (the controller tries both `User.find_by(username:)` and
        `User.find_by(email:)`). No authentication required.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: alice
              password: password123
      responses:
        '200':
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                user:
                  id: 1
                  username: alice
                  email: alice@example.com
                  created_at: "2026-08-06T14:38:50.247Z"
                  updated_at: "2026-08-06T14:38:50.247Z"
                  profile: null
                  employment_detail: null
                access_token: eyJhbGciOiJIUzI1NiJ9.eyJ1c2VyX2lkIjoxLCJ0eXBlIjoiYWNjZXNzIiwiZXhwIjoxNzU0NTk0NzMwfQ.xxx
                refresh_token: eyJhbGciOiJIUzI1NiJ9.eyJ1c2VyX2lkIjoxLCJ0eXBlIjoicmVmcmVzaCIsImV4cCI6MTc1NTE5ODczMH0.xxx
        '401':
          description: Unknown username/email or wrong password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Invalid username/email or password

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Exchange a refresh token for a new access token
      description: |
        Requires JWT type `refresh` — an access token submitted here is
        rejected. No `Authorization` header is used; the refresh token is
        passed in the body.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: A new access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
              example:
                access_token: eyJhbGciOiJIUzI1NiJ9.eyJ1c2VyX2lkIjoxLCJ0eXBlIjoiYWNjZXNzIiwiZXhwIjoxNzU0NTk0NzMwfQ.xxx
        '401':
          description: Refresh token missing, malformed, expired, revoked, or not of type `refresh`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Invalid refresh token

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Log out — revoke a refresh token
      description: |
        Requires a valid **access token** (`Authorization: Bearer`), plus the
        `refresh_token` of the session being ended in the body. Revokes only
        that one session — a user logged in on multiple devices stays logged
        in on the others. The refresh token must belong to the caller; one
        user cannot revoke another user's session even with a valid access
        token of their own.

        Revoking an already-revoked refresh token is not an error — calling
        this endpoint twice with the same token returns `200` both times.

        **Scope of the revocation:** this immediately stops the session from
        exchanging its refresh token for further access tokens. It does
        **not** invalidate an access token already issued for that session —
        that token keeps working, as normal, until its own 15-minute expiry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Logged out
        '401':
          description: >-
            No/invalid access token (standard auth failure), or the refresh_token is
            missing, malformed, expired, already revoked, or belongs to a different user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notLoggedIn:
                  summary: Missing/invalid access token
                  value: { error: "Please log in" }
                badRefreshToken:
                  summary: refresh_token invalid, expired, revoked, or not the caller's
                  value: { error: "Invalid refresh token" }

  /me:
    get:
      tags: [Users]
      summary: Get the current authenticated user
      description: Returns the caller's own User record (with nested profile/employment_detail). Any authenticated user.
      responses:
        '200':
          description: The current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me/counts:
    get:
      tags: [Users]
      summary: Get a role-scoped dashboard count summary for the current user
      description: |
        Any authenticated user. What's counted depends on the caller, checked
        in this order:
        - **admin** (`employment_detail.role == "admin"`): `teams`,
          `projects`, `tasks`, and `issues` across the whole company.
        - **team lead** (`teams.team_lead_id == caller.id` — the same
          designation Task/Issue authorization uses, not
          `employment_detail.role`, which can name a `team_lead` who isn't
          actually anyone's designated lead): `projects`, `tasks`, `issues`,
          and `team_members`, all belonging to the team they lead.
        - **member** (everyone else): `projects` (belonging to their own
          team), `my_tasks` (assigned to them), `issues` (raised by them),
          `due_today_tasks` (assigned to them with `due_date` of today), and
          `team_members` (headcount of their own team).

        Every count is `0` rather than an error when nothing applies (no
        team, no assignments, etc).
      responses:
        '200':
          description: Role-scoped counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardCounts'
              examples:
                admin:
                  value: { role: admin, counts: { teams: 3, projects: 12, tasks: 40, issues: 5 } }
                teamLead:
                  value: { role: team_lead, counts: { projects: 4, tasks: 10, issues: 2, team_members: 6 } }
                member:
                  value: { role: member, counts: { projects: 4, my_tasks: 3, issues: 1, due_today_tasks: 1, team_members: 6 } }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me/teammates:
    get:
      tags: [Users]
      summary: Get id and name of the current user's teammates
      description: |
        Any authenticated user. Returns everyone else sharing the caller's
        `employment_detail.team_id`, as just `id` and `full_name` — the
        caller themself is excluded. A caller with no team (e.g. an admin,
        or a member not yet assigned to one) gets an empty array, not an
        error.
      responses:
        '200':
          description: The caller's teammates (id + name only)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeammateName'
              example:
                - { id: 4, full_name: "Jane Doe" }
                - { id: 9, full_name: "Bob Smith" }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /password/forgot:
    post:
      tags: [Password Reset]
      summary: Request a password reset email
      description: |
        Always returns the same 200 response whether or not the email is
        registered, so this endpoint cannot be used to enumerate accounts.
        If the email matches a user, a reset token is generated (SHA-256
        digest stored on the user, raw token emailed) and an email is
        queued via `PasswordMailer#reset_instructions` (`deliver_later`).
        The reset token is valid for 2 hours from issuance.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Always returned, regardless of whether the email exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: If that email is registered, password reset instructions have been sent.

  /password/reset:
    patch:
      tags: [Password Reset]
      summary: Reset a password using the emailed token
      description: |
        `token` is the raw token emailed to the user (matched server-side
        against its stored SHA-256 digest). Rejected if the token doesn't
        match any user or if it was issued more than 2 hours ago. On
        success, the token is cleared (single-use).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Password has been reset. You can now log in.
        '422':
          description: Token invalid/expired, or the new password failed validation
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                invalidToken:
                  value: { error: "That reset link is invalid or has expired." }
                validationFailed:
                  value: { errors: ["Password confirmation doesn't match Password"] }

  /users:
    get:
      tags: [Users]
      summary: List users in the directory shape
      description: |
        Admin: every user. Team member with a team: their own team's roster.
        Team member with no team: `403`. No pagination.

        Every caller gets the same flat shape (`UserDirectoryEntry`) rather
        than the full nested `User` — this is a summary/listing view, not
        the full record (use `GET /users/{id}` for that). Any field backed
        by a missing `profile` or `employment_detail` record (or a missing
        team on the employment detail) renders as the literal string
        `"No record!"` instead of `null`.
      responses:
        '200':
          description: Array of directory entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserDirectoryEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Users]
      summary: Create a user
      description: Admin only. This is the only way accounts get created — there is no public sign-up.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
            example:
              username: bob
              email: bob@example.com
              password: password123
              password_confirmation: password123
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: Get a user
      description: Admin, or the user viewing their own record.
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Users]
      summary: Update a user
      description: |
        Admin only. Accepts the same fields as create, including
        `password`/`password_confirmation` — an admin can set a user's
        password directly through this endpoint (this is separate from,
        and in addition to, the self-service forgot-password flow).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    put:
      tags: [Users]
      summary: Update a user (full replace, same behavior as PATCH)
      description: Admin only. Rails routes PUT and PATCH to the same action; strong params are unchanged, so behavior is identical to PATCH.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [Users]
      summary: Delete a user
      description: "Admin only. Cascades to the user's Profile and Employment Detail (`dependent: :destroy`)."
      responses:
        '204':
          description: Deleted, no content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{user_id}/profile:
    parameters:
      - $ref: '#/components/parameters/UserIdPathParam'
    get:
      tags: [Profiles]
      summary: Get a user's profile
      description: Admin, or the user viewing their own profile. 404 if the user has no profile yet.
      responses:
        '200':
          description: The profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Profiles]
      summary: Create a profile for a user
      description: Admin only. Fails with 422 if the user already has a profile (one profile per user, enforced by a uniqueness validation and a unique DB index on `user_id`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileRequest'
            example:
              full_name: Bob Smith
              phone: "+1-555-0100"
              address: "123 Main St"
              city: Springfield
              country: USA
              image_url: "https://example.com/avatar.png"
      responses:
        '201':
          description: Profile created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    patch:
      tags: [Profiles]
      summary: Update a user's profile
      description: Admin only. 404 if the user has no profile yet (use POST to create one first).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileRequest'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    put:
      tags: [Profiles]
      summary: Update a user's profile (same behavior as PATCH)
      description: Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileRequest'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [Profiles]
      summary: Delete a user's profile
      description: Admin only. 404 if the user has no profile.
      responses:
        '204':
          description: Deleted, no content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{user_id}/employment_detail:
    parameters:
      - $ref: '#/components/parameters/UserIdPathParam'
    get:
      tags: [Employment Details]
      summary: Get a user's employment detail
      description: Admin, or the user viewing their own record. 404 if not set yet.
      responses:
        '200':
          description: The employment detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmploymentDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Employment Details]
      summary: Create an employment detail for a user
      description: |
        Admin only. One per user (uniqueness validation + unique DB index on
        `user_id`). `team_id` is optional — a brand-new employee may not be
        assigned to a team yet. If `role` is `admin`, `team_id` must be
        blank (validated server-side; a team-bearing admin record is
        rejected with 422).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmploymentDetailRequest'
            example:
              team_id: 2
              role: member
              job_position: Software Engineer
              joined_at: "2026-08-07T09:00:00Z"
      responses:
        '201':
          description: Employment detail created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmploymentDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    patch:
      tags: [Employment Details]
      summary: Update a user's employment detail
      description: Admin only. 404 if not set yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmploymentDetailRequest'
      responses:
        '200':
          description: Updated employment detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmploymentDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    put:
      tags: [Employment Details]
      summary: Update a user's employment detail (same behavior as PATCH)
      description: Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmploymentDetailRequest'
      responses:
        '200':
          description: Updated employment detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmploymentDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [Employment Details]
      summary: Delete a user's employment detail
      description: Admin only. 404 if not set.
      responses:
        '204':
          description: Deleted, no content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{user_id}/employment_detail/assign_team:
    parameters:
      - $ref: '#/components/parameters/UserIdPathParam'
    patch:
      tags: [Employment Details]
      summary: Assign or unassign a user's team
      description: |
        Admin only. One endpoint for both directions, driven entirely by
        `team_id`:
        - **Assign**: send `team_id` for a team that exists — it's set on
          the user's employment detail. A `team_id` that doesn't match any
          `Team` row is `404`, not silently accepted.
        - **Unassign**: omit `team_id`, or send it as `null` — the
          employment detail's `team_id` is cleared.

        404 if the user has no employment detail yet (create one first via
        `POST /users/{user_id}/employment_detail`). Subject to the same
        `admin_has_no_team` rule as every other write to this resource —
        assigning a team to a record whose `role` is `admin` is `422`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                team_id:
                  type: integer
                  nullable: true
              example:
                team_id: 2
      responses:
        '200':
          description: Employment detail with the team assigned or unassigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmploymentDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /teams:
    get:
      tags: [Teams]
      summary: List all teams
      description: |
        Admin only. No pagination. Returns the same flat summary shape
        (`TeamSummaryEntry`) as `GET /teams/{id}` — see that endpoint for
        details on the derived `team_lead_name` field.
      responses:
        '200':
          description: Array of team summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamSummaryEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Teams]
      summary: Create a team
      description: Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamRequest'
            example:
              name: Engineering
              description: Product engineering team
              team_lead_id: 3
      responses:
        '201':
          description: Team created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /teams/assign_lead:
    patch:
      tags: [Teams]
      summary: Assign or unassign a team's lead, by username
      description: |
        Admin only. A collection-level action — the team is identified by
        `team_id` in the body, not the URL. One endpoint for both
        directions:
        - **Assign**: send `team_id` and `username`. The named user must
          already have `employment_detail.role == "team_lead"` — this
          endpoint promotes no one, it only designates an already-promoted
          user as a specific team's lead. A user who isn't yet `team_lead`
          is rejected with `422` ("cannot be made team lead, first
          promote them" — do that via
          `PATCH /users/{user_id}/employment_detail`). A user who already
          leads a *different* team is also `422` (`team_lead_id` is unique
          per user). On success, the user's own
          `employment_detail.team_id` is also set to this team (a lead is
          always a member of the team they lead).
        - **Unassign**: send `team_id` with `username` omitted or blank —
          clears the team's `team_lead_id`, and cascades: the outgoing
          lead's `employment_detail.team_id` is cleared too.

        Unknown `team_id` or `username` is `404`, as is a user with no
        `employment_detail` at all. This is additive to the existing
        `PATCH /teams/{id}`, which still accepts `team_lead_id` directly
        with no role check or cascade.

        See also `PATCH /teams/assign_member` / `PATCH /teams/unassign_member`
        for managing plain (non-lead) team membership.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                team_id:
                  type: integer
                username:
                  type: string
                  description: Omit or send blank to unassign
              required: [team_id]
            example:
              team_id: 2
              username: alice
      responses:
        '200':
          description: Team with the lead assigned or unassigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamSummaryEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /teams/assign_member:
    patch:
      tags: [Teams]
      summary: Add a user as a plain (non-lead) member of a team
      description: |
        Admin only. Collection-level action — `team_id` and `username` are
        both required in the body. The named user must already have
        `employment_detail.role == "member"` (not `team_lead`/`admin`) —
        `422` otherwise. Sets `employment_detail.team_id` to this team,
        reassigning freely even if they already belong to a different team
        (no conflict — matches how
        `PATCH /users/{user_id}/employment_detail/assign_team` already
        behaves). Unknown `team_id`/`username`, or a user with no
        `employment_detail` at all, is `404`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                team_id:
                  type: integer
                username:
                  type: string
              required: [team_id, username]
            example:
              team_id: 2
              username: bob
      responses:
        '200':
          description: The user's employment detail, with team_id set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmploymentDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /teams/unassign_member:
    patch:
      tags: [Teams]
      summary: Remove a user's plain (non-lead) team membership
      description: |
        Admin only. Collection-level action — `team_id` and `username` are
        both required in the body. `team_id` must match the user's
        *current* `employment_detail.team_id` — `422` if they're not
        actually a member of that team. On success, sets
        `employment_detail.team_id` to `null`. Unknown `team_id`/`username`
        is `404`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                team_id:
                  type: integer
                username:
                  type: string
              required: [team_id, username]
            example:
              team_id: 2
              username: bob
      responses:
        '200':
          description: The user's employment detail, with team_id cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmploymentDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /teams/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Team ID
        schema:
          type: integer
    get:
      tags: [Teams]
      summary: Get a team
