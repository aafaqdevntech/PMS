        '204':
          description: Task deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /tasks/{id}/assign:
    post:
      tags: [Tasks]
      summary: Assign or reassign a task
      description: |
        The project team's designated lead only. Sets `assigned_to_id` and
        moves the task to `assigned` (work starts now) or `on_hold` (parked).
        Any other `status` value returns `422`.

        The assignee must be a member of the project's team, otherwise `422`.
        Works from any status, so this is also how a task is reassigned to a
        different member.
      parameters:
        - name: id
          in: path
          required: true
          description: Task ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskAssignRequest'
            example:
              assigned_to_id: 42
              status: assigned
      responses:
        '200':
          description: Task assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /tasks/{id}/unassign:
    delete:
      tags: [Tasks]
      summary: Unassign a task
      description: |
        The project team's designated lead only. Clears `assigned_to_id` and
        resets `status` to `unassigned`, from any status. Returns the task
        rather than `204`.
      parameters:
        - name: id
          in: path
          required: true
          description: Task ID
          schema:
            type: integer
      responses:
        '200':
          description: Task unassigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /tasks/{id}/status:
    patch:
      tags: [Tasks]
      summary: Move a task through the workflow
      description: |
        The project team's designated lead **or** the task's current
        assignee — anyone else (including admins and other teammates) gets
        `403`. Each of the two drives a different half of the workflow, and a
        lead who assigned the task to themself gets both sets:

        | From | Assignee may set | Lead may set |
        |---|---|---|
        | `assigned` | `working` | `on_hold` |
        | `working` | `ready_for_review` | `on_hold` |
        | `ready_for_review` | — | `returned`, `completed`, `on_hold` |
        | `returned` | `working`, `ready_for_review` | `on_hold` |
        | `on_hold` | — | `assigned` |
        | `completed` | — | `returned`, `on_hold` |

        `unassigned` is only entered and left through `/assign` and
        `/unassign`. A move that isn't in the caller's row — including
        setting the status the task already has — returns `422`, as does an
        unknown status value.

        Note that `completed` is reachable only from `ready_for_review`, so
        completion always passes through review; `completed` is not terminal
        and the lead can reopen it to `returned`.
      parameters:
        - name: id
          in: path
          required: true
          description: Task ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskStatusRequest'
            example:
              status: ready_for_review
      responses:
        '200':
          description: Status changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /issues/{issue_id}/comments:
    parameters:
      - name: issue_id
        in: path
        required: true
        description: Issue ID
        schema:
          type: integer
    get:
      tags: [Comments]
      summary: List an issue's comments
      description: |
        Admin, or any member of the issue's project's team. A member of any
        other team gets `403`, as does a user with no team at all.

        Returned oldest-first by `created_at`. No pagination. Readable at any
        issue status — a `resolved`/`rejected` issue keeps its conversation
        as history.
      responses:
        '200':
          description: Array of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Comments]
      summary: Comment on an issue
      description: |
        Any member of the issue's project's team, the team lead included.
        Other teams, users with no team, and **admins** get `403`.

        `user_id` is always the authenticated user and is never accepted as
        input. The parent is always taken from the path — `commentable_type`
        and `commentable_id` in the body are ignored.

        The team is derived through Issue → Project → Team and is never
        supplied by the client. Commenting is allowed at any issue status,
        including after the issue is closed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentRequest'
            example:
              body: Reproduced on Safari 17 — it's the flex basis, not the media query.
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /tasks/{task_id}/comments:
    parameters:
      - name: task_id
        in: path
        required: true
        description: Task ID
        schema:
          type: integer
    get:
      tags: [Comments]
      summary: List a task's comments
      description: |
        Admin, or any member of the task's project's team. A member of any
        other team gets `403`, as does a user with no team at all.

        Returned oldest-first by `created_at`. No pagination. Readable at any
        task status.
      responses:
        '200':
          description: Array of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Comments]
      summary: Comment on a task
      description: |
        Any member of the task's project's team — the lead, the assignee and
        every other member alike. Other teams, users with no team, and
        **admins** get `403`.

        `user_id` is always the authenticated user and is never accepted as
        input. The parent is always taken from the path — `commentable_type`
        and `commentable_id` in the body are ignored.

        The team is derived through Task → Project → Team and is never
        supplied by the client. Commenting is allowed at any task status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentRequest'
            example:
              body: Picking this up now — should be ready for review tomorrow.
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /comments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Comment ID
        schema:
          type: integer
    patch:
      tags: [Comments]
      summary: Edit a comment
      description: |
        The **author only** — a teammate, the team lead, and an admin all get
        `403`. Only `body` can be changed; a comment can never be moved to
        another parent or reassigned to another user, so `user_id`,
        `commentable_type` and `commentable_id` in the body are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentRequest'
            example:
              body: Correction — it reproduces below 900px, not 1200px.
      responses:
        '200':
          description: Comment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    put:
      tags: [Comments]
      summary: Edit a comment (alias of PATCH)
      description: Identical to `PATCH /comments/{id}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentRequest'
      responses:
        '200':
          description: Comment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [Comments]
      summary: Delete a comment
      description: |
        The **author**, or an **admin** (any comment, on any team). A
        teammate and the team lead both get `403` on someone else's comment.

        Comments are also deleted automatically when their issue or task is
        deleted, or when their author's user account is deleted.
      responses:
        '204':
          description: Deleted, no content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token from `POST /auth/login` or `POST /auth/refresh`, sent
        as `Authorization: Bearer <token>`. Must be a token of JWT `type:
        "access"` — a refresh token here is treated the same as no token at
        all (401).

  parameters:
    UserId:
      name: id
      in: path
      required: true
      description: User ID
      schema:
        type: integer
    UserIdPathParam:
      name: user_id
      in: path
      required: true
      description: User ID (parent resource)
      schema:
        type: integer

  responses:
    Unauthorized:
      description: Missing/invalid/expired access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Please log in
    Forbidden:
      description: Authenticated, but not permitted to perform this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: You are not authorized to perform this action
    NotFound:
      description: Record not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Record not found
    UnprocessableEntity:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          example:
            errors: ["Email has already been taken", "Username can't be blank"]

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    ValidationErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: string
      required: [errors]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    LoginRequest:
      type: object
      description: "`username` accepts either the actual username or the email address — the server tries both."
      properties:
        username:
          type: string
          example: alice
        password:
          type: string
          format: password
          example: password123
      required: [username, password]

    LoginResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        access_token:
          type: string
          description: JWT, type "access", expires in 15 minutes
        refresh_token:
          type: string
          description: JWT, type "refresh", expires in 7 days
      required: [user, access_token, refresh_token]

    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
      required: [refresh_token]

    RefreshResponse:
      type: object
      properties:
        access_token:
          type: string
          description: JWT, type "access", expires in 15 minutes
      required: [access_token]

    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required: [email]

    ResetPasswordRequest:
      type: object
      properties:
        token:
          type: string
          description: Raw token from the emailed reset link (not the hashed value stored server-side)
        password:
          type: string
          format: password
        password_confirmation:
          type: string
          format: password
      required: [token, password, password_confirmation]

    User:
      type: object
      description: Embeds `profile` and `employment_detail` inline; both are `null` if not yet created for this user.
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        profile:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Profile'
        employment_detail:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/EmploymentDetail'
      required: [id, username, email, created_at, updated_at]

    UserCreateRequest:
      type: object
      properties:
        username:
          type: string
          description: Required, unique (case-insensitive)
        email:
          type: string
          format: email
          description: Required, unique (case-insensitive), must be a valid email format
        password:
          type: string
          format: password
          description: Required (via has_secure_password); no explicit minimum length enforced beyond bcrypt's own limits
        password_confirmation:
          type: string
          format: password
          description: Must match `password` if provided
      required: [username, email, password]

    UserUpdateRequest:
      type: object
      description: All fields optional on update; only supplied fields are changed. Same validation rules as create.
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        password_confirmation:
          type: string
          format: password

    Profile:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        full_name:
          type: string
        phone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        image_url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, user_id, full_name, created_at, updated_at]

    ProfileRequest:
      type: object
      properties:
        full_name:
          type: string
          description: Required
        phone:
          type: string
        address:
          type: string
        city:
          type: string
        country:
          type: string
        image_url:
          type: string
      required: [full_name]

    EmploymentDetail:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        team_id:
          type: integer
          nullable: true
          description: Null for admins (enforced) and for employees not yet assigned to a team
        role:
          type: string
          enum: [admin, team_lead, member]
        job_position:
          type: string
        joined_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, user_id, role, job_position, joined_at, created_at, updated_at]

    EmploymentDetailRequest:
      type: object
      properties:
        team_id:
          type: integer
          nullable: true
          description: Optional. Must be omitted/null if role is "admin".
        role:
          type: string
          enum: [admin, team_lead, member]
          description: Defaults to "member" (enum default 2) if omitted
        job_position:
          type: string
          description: Required
        joined_at:
          type: string
          format: date-time
          description: Required
      required: [job_position, joined_at]

    Team:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        team_lead_id:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, name, created_at, updated_at]

    TeamRequest:
      type: object
      properties:
        name:
          type: string
          description: Required, unique (case-insensitive)
        description:
          type: string
        team_lead_id:
          type: integer
          nullable: true
          description: Optional — a team may have no lead yet
      required: [name]

    Project:
      type: object
      properties:
        id:
          type: integer
        team_id:
          type: integer
          nullable: true
          description: Null until assigned via POST /projects/{id}/assign_team
        created_by_id:
          type: integer
          description: The admin who created the project. System-controlled, never editable.
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [planning, active, onhold, completed, archived]
        start_date:
          type: string
          format: date
          nullable: true
          description: Auto-set the first time status becomes "active"; never set manually
        end_date:
          type: string
          format: date
          nullable: true
          description: Admin-settable. Must be strictly after start_date if both are present.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, created_by_id, title, status, created_at, updated_at]

    ProjectCreateRequest:
      type: object
      properties:
        title:
          type: string
          description: Required
        description:
          type: string
      required: [title]

    ProjectUpdateRequest:
      type: object
      description: All fields optional; only supplied fields are changed. team_id is not accepted (use assign_team/unassign_team).
      properties:
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [planning, active, onhold, completed, archived]
          description: active/onhold/completed require the project to already have a team; planning/archived do not
        end_date:
          type: string
          format: date

    Issue:
      type: object
      properties:
        id:
          type: integer
        project_id:
          type: integer
        raised_by_id:
          type: integer
          description: The team member who raised the issue. System-controlled, never editable.
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [open, resolved, rejected]
          description: Starts as "open". Only the project team's lead can move it to resolved/rejected, and that transition is permanent.
        resolution_note:
          type: string
          nullable: true
          description: Null while open. Set by the team lead when resolving or rejecting, and required at that point.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, project_id, raised_by_id, title, status, created_at, updated_at]

    IssueCreateRequest:
      type: object
      properties:
        title:
          type: string
          description: Required
        description:
          type: string
      required: [title]

    IssueUpdateRequest:
      type: object
      description: All fields optional. status and resolution_note are not accepted here — use the resolve/reject endpoints.
      properties:
        title:
          type: string
        description:
          type: string

    IssueCloseRequest:
      type: object
      properties:
        resolution_note:
          type: string
          description: Required — the lead's justification for resolving or rejecting
      required: [resolution_note]

    Task:
      type: object
      properties:
        id:
          type: integer
        project_id:
          type: integer
        issue_id:
          type: integer
          nullable: true
          description: The issue this task was promoted from, if any. Must belong to the same project.
        created_by_id:
          type: integer
          description: The project team's lead who created the task. System-controlled, never editable.
        assigned_to_id:
          type: integer
          nullable: true
          description: The team member currently working the task. Set only through /assign and /unassign.
        title:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 5000
        priority:
          type: string
          enum: [critical, high, medium, normal]
          description: Defaults to "normal".
        status:
          type: string
          enum: [unassigned, assigned, working, on_hold, ready_for_review, returned, completed]
          description: >-
            Starts as "unassigned". Always travels with assigned_to_id — any status other than
            "unassigned" requires an assignee, and clearing the assignee returns it to "unassigned".
        due_date:
          type: string
          format: date
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, project_id, created_by_id, title, description, priority, status, created_at, updated_at]

    TaskCreateRequest:
      type: object
      description: status, assigned_to_id and created_by_id are not accepted — a task always starts unassigned.
      properties:
        title:
          type: string
          maxLength: 255
          description: Required
        description:
          type: string
          maxLength: 5000
          description: Required
        priority:
          type: string
          enum: [critical, high, medium, normal]
        due_date:
          type: string
          format: date
        issue_id:
          type: integer
          description: Optional — must be an issue on the same project
      required: [title, description]

    TaskUpdateRequest:
      type: object
      description: All fields optional. status and assigned_to_id are not accepted here — use /assign, /unassign, /status.
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 5000
        priority:
          type: string
          enum: [critical, high, medium, normal]
        due_date:
          type: string
          format: date
        issue_id:
          type: integer

    TaskAssignRequest:
      type: object
      properties:
        assigned_to_id:
          type: integer
          description: Required — a member of the project's team
        status:
          type: string
          enum: [assigned, on_hold]
          description: Defaults to "assigned". Any other value is rejected with 422.
      required: [assigned_to_id]

    TaskStatusRequest:
      type: object
      properties:
        status:
          type: string
          enum: [assigned, working, on_hold, ready_for_review, returned, completed]
          description: >-
            Required — must be a legal move for the caller from the task's current status
            (see the transition table on PATCH /tasks/{id}/status).
      required: [status]

    Comment:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
          description: The author. Always the authenticated user at creation, never editable.
        commentable_type:
          type: string
          enum: [Issue, Task]
          description: Which kind of record the comment hangs off. Set from the request path, never editable.
        commentable_id:
          type: integer
          description: The Issue or Task the comment belongs to. Set from the request path, never editable.
        body:
          type: string
          maxLength: 5000
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, user_id, commentable_type, commentable_id, body, created_at, updated_at]

    CommentRequest:
      type: object
      description: >-
        Used for both create and update. user_id, commentable_type and commentable_id are not
        accepted — the author is the authenticated user and the parent comes from the path.
      properties:
        body:
          type: string
          maxLength: 5000
          description: Required — 1 to 5000 characters. Blank or over-long returns 422.
      required: [body]
